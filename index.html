<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semester Study Tracker</title>
    <style>
        :root {
            --bg-color: #0b0f17;
            --card-bg: rgba(18, 24, 38, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --accent-glow: #7c3aed;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --scrollbar-bg: #111622;
            --scrollbar-thumb: #2d3748;
            --scrollbar-hover: #4a5568;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Standard Custom Scrollbar for WebKit (Chrome, Safari, Edge) */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--scrollbar-bg);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 4px;
            border: 2px solid var(--scrollbar-bg);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-hover);
        }

        /* Firefox Custom Scrollbar Support */
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-bg);
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 10% 10%, rgba(124, 58, 237, 0.12) 0px, transparent 40%),
                radial-gradient(at 90% 90%, rgba(59, 130, 246, 0.12) 0px, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            padding: 5px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            padding: 12px 10px;
            margin-bottom: 5px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            animation: fadeInDown 0.6s ease-out;
        }

        header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2px;
            letter-spacing: -0.5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .table-wrapper {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow-x: auto;
            overflow-y: auto;
            max-height: calc(100vh - 85px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: fadeInUp 0.6s ease-out;
            cursor: grab;
            user-select: none;
            -webkit-overflow-scrolling: touch;
        }

        .table-wrapper:active {
            cursor: grabbing;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            white-space: nowrap;
        }

        th, td {
            padding: 0.75rem 0.6rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid rgba(255, 255, 255, 0.03);
        }

        th {
            background: #111622;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th.subject-header, td.subject-name {
            text-align: left;
            position: sticky;
            left: 0;
            background: #141a26;
            z-index: 20;
            font-weight: 600;
            min-width: 180px;
            max-width: 220px;
            border-right: 2px solid var(--border-color);
            padding-left: 1rem;
        }

        th.subject-header {
            z-index: 30;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: rgba(255, 255, 255, 0.02);
        }

        tr:hover td.subject-name {
            background-color: #1a2232;
        }

        /* Custom Modern Checkbox Styling */
        .checkbox-group {
            display: flex;
            gap: 6px;
            justify-content: center;
            align-items: center;
        }

        .custom-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #3b4252;
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            outline: none;
        }

        .custom-checkbox:hover {
            border-color: var(--accent-blue);
            transform: scale(1.1);
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.3);
        }

        .custom-checkbox:checked {
            background-color: var(--accent-green);
            border-color: var(--accent-green);
            transform: scale(1.05);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
        }

        .custom-checkbox:checked::after {
            content: '';
            position: absolute;
            left: 5px;
            top: 2px;
            width: 4px;
            height: 8px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        /* Progress Bar Styling */
        .progress-cell {
            min-width: 150px;
            padding-right: 1rem;
            padding-left: 1rem;
            position: sticky;
            right: 0;
            background: #141a26;
            z-index: 15;
            border-left: 2px solid var(--border-color);
        }

        th.progress-header {
            position: sticky;
            right: 0;
            z-index: 25;
            background: #111622;
            border-left: 2px solid var(--border-color);
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .progress-bar-bg {
            flex-grow: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
            border-radius: 10px;
            transition: width 0.35s ease-in-out;
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.5);
        }

        .progress-text {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-main);
            min-width: 36px;
            text-align: right;
        }

        /* Responsive Tweaks */
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.3rem;
            }
            th, td {
                padding: 0.6rem 0.4rem;
            }
            th.subject-header, td.subject-name {
                min-width: 140px;
                font-size: 0.85rem;
            }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Semester Study Tracker</h1>
        <p>14-Week Modular Progress Dashboard</p>
    </header>

    <div class="table-wrapper" id="tableWrapper">
        <table id="trackerTable">
            <thead>
                <tr id="headerRow">
                    <th class="subject-header">Subject</th>
                    <!-- Week columns generated dynamically -->
                    <th class="progress-header">Progress</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Subject rows generated dynamically -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const subjects = [
        "Database",
        "Networking",
        "Project Management",
        "UI UX",
        "Quality Assurance",
        "Programming Project"
    ];

    const TOTAL_WEEKS = 14;
    const SESSIONS_PER_WEEK = 3;
    const TOTAL_SESSIONS_PER_SUBJECT = TOTAL_WEEKS * SESSIONS_PER_WEEK;

    let trackerState = JSON.parse(localStorage.getItem('semester_tracker_state')) || {};

    function initTable() {
        const headerRow = document.getElementById('headerRow');
        const tableBody = document.getElementById('tableBody');
        const progressHeader = headerRow.querySelector('.progress-header');

        // Create Week Headers (Week 1 to Week 14)
        for (let w = 1; w <= TOTAL_WEEKS; w++) {
            const th = document.createElement('th');
            th.textContent = `W${w}`;
            headerRow.insertBefore(th, progressHeader);
        }

        // Create Rows for each Subject
        subjects.forEach((subject, subjectIdx) => {
            const tr = document.createElement('tr');

            // Subject Name Cell
            const tdName = document.createElement('td');
            tdName.className = 'subject-name';
            tdName.textContent = subject;
            tr.appendChild(tdName);

            // Week Checkbox Cells
            for (let w = 1; w <= TOTAL_WEEKS; w++) {
                const tdWeek = document.createElement('td');
                const checkboxGroup = document.createElement('div');
                checkboxGroup.className = 'checkbox-group';

                for (let s = 1; s <= SESSIONS_PER_WEEK; s++) {
                    const cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.className = 'custom-checkbox';
                    
                    const cbKey = `s${subjectIdx}_w${w}_session${s}`;
                    cb.checked = !!trackerState[cbKey];

                    cb.addEventListener('change', (e) => {
                        trackerState[cbKey] = e.target.checked;
                        localStorage.setItem('semester_tracker_state', JSON.stringify(trackerState));
                        updateProgress(subjectIdx);
                    });

                    checkboxGroup.appendChild(cb);
                }

                tdWeek.appendChild(checkboxGroup);
                tr.appendChild(tdWeek);
            }

            // Progress Bar Cell
            const tdProgress = document.createElement('td');
            tdProgress.className = 'progress-cell';
            tdProgress.innerHTML = `
                <div class="progress-container">
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="progress-fill-${subjectIdx}"></div>
                    </div>
                    <span class="progress-text" id="progress-text-${subjectIdx}">0%</span>
                </div>
            `;
            tr.appendChild(tdProgress);

            tableBody.appendChild(tr);

            // Initial progress calculation
            updateProgress(subjectIdx);
        });

        setupDragToScroll();
    }

    function updateProgress(subjectIdx) {
        let checkedCount = 0;

        for (let w = 1; w <= TOTAL_WEEKS; w++) {
            for (let s = 1; s <= SESSIONS_PER_WEEK; s++) {
                const cbKey = `s${subjectIdx}_w${w}_session${s}`;
                if (trackerState[cbKey]) {
                    checkedCount++;
                }
            }
        }

        const percentage = Math.round((checkedCount / TOTAL_SESSIONS_PER_SUBJECT) * 100);
        
        const fillElement = document.getElementById(`progress-fill-${subjectIdx}`);
        const textElement = document.getElementById(`progress-text-${subjectIdx}`);

        if (fillElement && textElement) {
            fillElement.style.width = `${percentage}%`;
            textElement.textContent = `${percentage}%`;

            if (percentage === 100) {
                fillElement.style.background = 'var(--accent-green)';
            } else {
                fillElement.style.background = 'linear-gradient(90deg, var(--accent-blue), var(--accent-green))';
            }
        }
    }

    // Drag-to-Scroll & Mouse Wheel Scroll Enhancement
    function setupDragToScroll() {
        const slider = document.getElementById('tableWrapper');
        let isDown = false;
        let startX;
        let scrollLeft;

        // Shift + Wheel Horizontal Scrolling
        slider.addEventListener('wheel', (e) => {
            if (e.deltaY !== 0) {
                e.preventDefault();
                slider.scrollLeft += e.deltaY;
            }
        }, { passive: false });

        // Mouse Drag Interaction
        slider.addEventListener('mousedown', (e) => {
            if (e.target.tagName === 'INPUT') return; // Allow clicking checkboxes directly
            isDown = true;
            slider.classList.add('active');
            startX = e.pageX - slider.offsetLeft;
            scrollLeft = slider.scrollLeft;
        });

        slider.addEventListener('mouseleave', () => {
            isDown = false;
        });

        slider.addEventListener('mouseup', () => {
            isDown = false;
        });

        slider.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - slider.offsetLeft;
            const walk = (x - startX) * 1.5; // Drag sensitivity multiplier
            slider.scrollLeft = scrollLeft - walk;
        });
    }

    document.addEventListener('DOMContentLoaded', initTable);
</script>

</body>
</html>
