<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semester Study Tracker</title>
    <link rel="icon" type="image/x-icon" href="icon.ico">
    
    <!-- Google Material Symbols (Icons) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <h1>Semester Study Tracker</h1>
        <p>14-Week Modular Progress Dashboard</p>
    </header>

    <!-- Main Schedule Table Wrapper -->
    <div class="table-wrapper" id="tableWrapper">
        <table id="trackerTable">
            <thead>
                <tr id="headerRow">
                    <th class="subject-header">Subject</th>
                    <!-- Week columns generated via JS -->
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Subject rows generated via JS -->
            </tbody>
        </table>
    </div>

    <!-- Separate Progress Summary Window -->
    <div class="progress-window">
        <h2>📊 Overall Progress Summary</h2>
        <table class="progress-table">
            <thead>
                <tr>
                    <th>Subject</th>
                    <th>Completion Status</th>
                </tr>
            </thead>
            <tbody id="progressTableBody">
                <!-- Progress rows generated via JS -->
            </tbody>
        </table>
    </div>

    <!-- Dynamic To-Do List Section -->
    <div class="todo-window">
        <h2>📝 Semester To-Do & Task Planner</h2>
        
        <!-- Error Message Alert Container -->
        <div id="todoErrorMsg" class="error-msg" style="display: none;"></div>

        <!-- Input Form Controls -->
        <div class="todo-form">
            <select id="todoSubjectSelect" class="todo-input">
                <option value="" disabled selected>-- Select Subject --</option>
            </select>

            <select id="todoWeekSelect" class="todo-input">
                <option value="" disabled selected>-- Select Week --</option>
            </select>

            <input type="text" id="todoTaskInput" class="todo-input task-text-input" placeholder="Enter task description..." />

            <button id="addTodoBtn" class="todo-btn">Add Task</button>
        </div>

        <!-- Task List Container -->
        <div class="todo-list-container">
            <ul id="todoList" class="todo-list">
                <!-- Tasks rendered dynamically via JS -->
            </ul>
        </div>
    </div>
</div>

<!-- Full-Screen Blurred Modal Layer for Weekly Notes -->
<div id="noteModalOverlay" class="modal-overlay" style="display: none;">
    <div class="modal-window">
        <div class="modal-header">
            <h3 id="modalTitle">Weekly Note</h3>
            <button id="closeModalBtn" class="modal-close-btn">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <div class="modal-body">
            <textarea id="modalNoteText" class="modal-textarea" placeholder="Write your notes for this week here..."></textarea>
        </div>
        <div class="modal-footer">
            <button id="deleteNoteBtn" class="btn-modal-delete">Delete Note</button>
            <button id="saveNoteBtn" class="btn-modal-save">Save Note</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
